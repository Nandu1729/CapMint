# CapMint Continuous Integration Pipeline (.github/workflows/ci.yml)

name: CapMint CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  validate-and-test:
    name: Workspace Verification & Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: capmint_test
          POSTGRES_USER: capmint_admin
          POSTGRES_PASSWORD: capmint_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Lint Workspace Styles
        run: npm run lint --if-present

      - name: Compile Workspace Packages
        run: npm run build --if-present

      - name: Run Test Suites
        env:
          DATABASE_URL: postgres://capmint_admin:capmint_secure_password@localhost:5432/capmint_test
          REDIS_URL: redis://localhost:6379/0
        run: npm run test --if-present

      - name: Verify Migration Runner Unit Tests
        run: npm test --workspace=backend/e2e-tests -- migration-runner.unit.test.ts

      - name: Verify PostgreSQL Bootstrap and Reconciliation
        env:
          DATABASE_URL: postgres://capmint_admin:capmint_secure_password@localhost:5432/capmint_test
          RUN_C1_INTEGRATION: '1'
          C1_TEST_RUN_ID: ci_${{ github.run_id }}
        run: npm test --workspace=backend/e2e-tests -- migration-reconciliation.test.ts

      - name: Verify Secure Administrator Bootstrap and Development Seed
        env:
          DATABASE_URL: postgres://capmint_admin:capmint_secure_password@localhost:5432/capmint_test
          REDIS_URL: redis://localhost:6379/0
          RUN_F2_INTEGRATION: '1'
          F2_TEST_RUN_ID: ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: npm test --workspace=backend/e2e-tests -- bootstrap-seed.test.ts

      - name: Run Tenant-Scoped Compliance Suite
        env:
          DATABASE_URL: postgres://capmint_admin:capmint_secure_password@localhost:5432/capmint_test
          REDIS_URL: redis://localhost:6379/0
          RUN_F1_COMPLIANCE: '1'
          F1_SUITE_RUN_ID: ci_${{ github.run_id }}_${{ github.run_attempt }}
          F1_SUITE_ITERATIONS: '1'
        run: npm test --workspace=backend/e2e-tests -- compliance-suite.test.ts

  data-integrity-canary:
    name: Over-Issuance Data Integrity Canary
    if: >-
      ${{
        vars.RUN_DATA_INTEGRITY_CANARY == '1' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
      }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CAPMINT_INTEGRATION_DATABASE_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Require Integration Database
        run: test -n "$DATABASE_URL"

      - name: Fail on Any Over-Issued Lot
        run: node scripts/check-overfilled-lots.mjs
