global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: capmint-auth
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8081

  - job_name: capmint-cpq
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8082

  - job_name: capmint-mint
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8083

  - job_name: capmint-resolver
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8084

  - job_name: capmint-transparency
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8085

  - job_name: capmint-verification
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8086

  - job_name: capmint-integration
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8087
