title: Exporter
description: Registered exporter entity
type: object
required:
- id
- name
- registrationNumber
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier (UUID v4).
    example: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
  name:
    type: string
    description: Human-readable legal name of the entity.
    example: Premium Farms Ltd
  registrationNumber:
    type: string
    description: The registrationNumber attribute.
    example: string
example:
  id: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
  name: Premium Farms Ltd
  registrationNumber: string
