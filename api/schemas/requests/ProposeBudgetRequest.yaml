title: ProposeBudgetRequest
type: object
required:
- certifier_id
- source_unit_type
- approved_quantity
- yield_assumptions
- signature_bundle
- effective_start_date
- effective_end_date
properties:
  producer_id:
    type: string
    format: uuid
    description: Legacy producer profile identifier. When omitted, the backend resolves the caller's single owned producer profile; when supplied, it must resolve to that caller.
    example: 00000000-0000-0000-0000-000000000002
  certifier_id:
    type: string
    format: uuid
    description: Unique identifier referencing the certifier body.
    example: 00000000-0000-0000-0000-000000000001
  source_unit_type:
    type: string
    enum:
    - UNIT_COUNT
    - WEIGHT_KG
    description: Measurement unit standard (e.g. weight, count).
    example: WEIGHT_KG
  approved_quantity:
    type: number
    description: Total certified crop volume allocated.
    example: 5000.0
  yield_assumptions:
    type: object
    required:
    - crop
    properties:
      crop:
        type: string
        description: Crop name.
        example: Organic White Honey
      land_area_hectares:
        type: number
        description: Land area in hectares.
        example: 5.0
    description: Agricultural yield parameters.
    example:
      crop: Organic White Honey
      land_area_hectares: 5.0
  signature_bundle:
    type: string
    description: Ed25519 cryptographic signatures payload.
    example: sig_bundle_xyz123
  effective_start_date:
    type: string
    format: date-time
    description: ISO-8601 validity start timestamp.
    example: '2026-07-17T00:00:00Z'
  effective_end_date:
    type: string
    format: date-time
    description: ISO-8601 validity expiration timestamp.
    example: '2027-07-17T00:00:00Z'
description: ProposeBudgetRequest data schema.
example:
  producer_id: 00000000-0000-0000-0000-000000000002
  certifier_id: 00000000-0000-0000-0000-000000000001
  source_unit_type: WEIGHT_KG
  approved_quantity: 5000.0
  yield_assumptions:
    crop: Organic White Honey
    land_area_hectares: 5.0
  signature_bundle: sig_bundle_xyz123
  effective_start_date: '2026-07-17T00:00:00Z'
  effective_end_date: '2027-07-17T00:00:00Z'
