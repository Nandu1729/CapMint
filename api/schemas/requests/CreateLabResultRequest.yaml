title: CreateLabResultRequest
type: object
required:
- lot_id
- lab_name
- test_type
- result_summary
- report_hash
properties:
  lot_id:
    type: string
    description: Unique batch lot identifier.
    example: 00000000-0000-0000-0000-000000000050
    format: uuid
  lab_name:
    type: string
    description: The lab_name attribute.
    example: string
  test_type:
    type: string
    description: The test_type attribute.
    example: string
  result_summary:
    type: string
    enum:
    - PASSED
    - FAILED
    description: The result_summary attribute.
    example: string
  report_hash:
    type: string
    description: The report_hash attribute.
    example: string
  report_reference:
    type: string
    description: The report_reference attribute.
    example: string
description: CreateLabResultRequest data schema.
example:
  lot_id: 00000000-0000-0000-0000-000000000050
  lab_name: string
  test_type: string
  result_summary: string
  report_hash: string
  report_reference: string
