title: AuditMetadata
description: User and creation audit trail parameters
type: object
required:
- created_by
- created_at
properties:
  created_by:
    type: string
    format: uuid
    description: Identity UUID of the creator
    example: string
  created_at:
    type: string
    format: date-time
    description: ISO date-time of creation
    example: '2026-07-17T10:00:00Z'
  updated_by:
    type: string
    format: uuid
    nullable: true
    description: The updated_by attribute.
    example: string
  updated_at:
    type: string
    format: date-time
    nullable: true
    description: ISO-8601 update timestamp.
    example: '2026-07-17T10:05:00Z'
example:
  created_by: string
  created_at: '2026-07-17T10:00:00Z'
  updated_by: string
  updated_at: '2026-07-17T10:05:00Z'
