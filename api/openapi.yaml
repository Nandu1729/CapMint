openapi: 3.0.3
info:
  title: CapMint Core API Specifications
  version: 1.0.0
  description: Canonical REST API contracts and validation schemas for the CapMint
    anti-counterfeiting platform.
servers:
- url: http://localhost:8080
  description: Dev Gateway (Local Proxy)
paths:
  /api/v1/auth/register-org:
    post:
      summary: Register an organization and its administrator
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/RegisterUserRequest.yaml
            example:
              username: admin
              password: password
              role: ADMIN
              associated_entity_id: string
      responses:
        '201':
          $ref: ./components/responses/RegisterUserResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '409':
          $ref: ./components/responses/ConflictError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/auth/login:
    post:
      summary: Login user
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/LoginRequest.yaml
            example:
              username: admin
              password: password
      responses:
        '200':
          $ref: ./components/responses/LoginResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/auth/users:
    get:
      summary: Get all registered users
      tags:
      - Authentication
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: ./components/responses/UserListResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/auth/users/invite:
    post:
      summary: Invite a new user to the organization
      tags:
      - Authentication
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/InviteUserRequest.yaml
            example:
              username: admin
              password: password
              role: ADMIN
      responses:
        '201':
          $ref: ./components/responses/UserResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/auth/organizations:
    get:
      summary: List all organizations (System Admin only)
      tags:
      - Authentication
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: ./components/responses/OrganizationListResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/auth/organizations/{id}/status:
    post:
      summary: Update organization status (System Admin only)
      tags:
      - Authentication
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - PENDING
                  - ACTIVATED
                  - SUSPENDED
      responses:
        '200':
          $ref: ./components/responses/OrganizationResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/budgets:
    post:
      summary: Propose a crop yield quota budget
      description: The authenticated producer organization is authoritative. The backend resolves its single producer profile when producer_id is omitted; a legacy producer_id is accepted only when it names a caller-owned profile, and ambiguous ownership fails closed. Draft requests do not carry certifier signatures; activation adds the certifier signature after the budget ID exists.
      tags:
      - Quota & Budgets (CPQ)
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/ProposeBudgetRequest.yaml
            example:
              certifier_id: 00000000-0000-0000-0000-000000000001
              source_unit_type: WEIGHT_KG
              approved_quantity: 5000.0
              yield_assumptions:
                crop: Organic White Honey
                land_area_hectares: 5.0
              effective_start_date: '2026-07-17T00:00:00Z'
              effective_end_date: '2027-07-17T00:00:00Z'
      responses:
        '201':
          $ref: ./components/responses/BudgetResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
    get:
      summary: Retrieve tenant-scoped quota budgets
      description: Producers see their budgets, certifiers see budgets assigned to them, and system-administrator admins may see all budgets.
      tags:
      - Quota & Budgets (CPQ)
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: ./components/responses/BudgetListResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/certifiers:
    get:
      summary: List active certification bodies available for budget requests
      tags:
      - Quota & Budgets (CPQ)
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: ./components/responses/CertifierListResponse.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
  /api/v1/budgets/{id}/activate:
    post:
      summary: Approve/Activate a budget assigned to the caller's certifier
      tags:
      - Quota & Budgets (CPQ)
      security:
      - BearerAuth: []
      parameters:
      - $ref: ./components/parameters/BudgetId.yaml
      responses:
        '200':
          $ref: ./components/responses/BudgetApprovalResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '409':
          $ref: ./components/responses/ConflictError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/budgets/{id}/drawdown:
    post:
      summary: Draw down capacity from the owning producer's active quota
      tags:
      - Quota & Budgets (CPQ)
      security:
      - BearerAuth: []
      parameters:
      - $ref: ./components/parameters/BudgetId.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/BudgetDrawdownRequest.yaml
            example:
              amount: 1.0
      responses:
        '200':
          $ref: ./components/responses/BudgetDrawdownResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/mint:
    post:
      summary: Mint serialized numbers for a lot owned by the caller's producer
      tags:
      - Serialization & Minting
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/MintQRCodeRequest.yaml
            example:
              lot_id: 00000000-0000-0000-0000-000000000050
              gtin: 07612345678900
              quantity: 100
      responses:
        '201':
          $ref: ./components/responses/MintQRCodeResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '409':
          $ref: ./components/responses/ConflictError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/gs1/validate:
    post:
      summary: Validate a GS1 GTIN key format
      tags:
      - Serialization & Minting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/GS1ValidateRequest.yaml
            example:
              gtin: 07612345678900
      responses:
        '200':
          $ref: ./components/responses/GS1ValidateResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /01/{gtin}/21/{serial}:
    get:
      summary: Resolve canonical GS1 Digital Link redirection
      tags:
      - Resolver Redirects
      parameters:
      - $ref: ./components/parameters/GTIN.yaml
      - $ref: ./components/parameters/Serial.yaml
      responses:
        '302':
          description: Redirects to consumer provenance verification interface
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /log/api/v1/log:
    post:
      summary: Append a block to the auditable transparency log
      tags:
      - Transparency Log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/AppendTransparencyLogRequest.yaml
            example:
              entity_type: USER
              entity_id: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
              eventType: string
              payload:
                user_id: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
      responses:
        '201':
          $ref: ./components/responses/TransparencyLedgerEntryResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /log/api/v1/log/entries:
    get:
      summary: Retrieve tenant-scoped transparency log entries
      tags:
      - Transparency Log
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: ./components/responses/TransparencyLedgerChainResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /log/api/v1/log/verify:
    get:
      summary: Verify the integrity of the transparency ledger
      tags:
      - Transparency Log
      responses:
        '200':
          $ref: ./components/responses/TransparencyLedgerVerificationResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/log/entries:
    $ref: '#/paths/~1log~1api~1v1~1log~1entries'
  /api/v1/log/verify:
    $ref: '#/paths/~1log~1api~1v1~1log~1verify'
  /api/v1/verify/{gtin}/{serial}:
    post:
      summary: Verify product authenticity & scan coordinates
      tags:
      - Verification & Clones
      parameters:
      - $ref: ./components/parameters/GTIN.yaml
      - $ref: ./components/parameters/Serial.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/VerifyCodeRequest.yaml
            example:
              lat: 12.9716
              lon: 77.5946
              device_metadata:
                browser: Mozilla/5.0 Chrome/120.0
                platform: macOS
      responses:
        '200':
          $ref: ./components/responses/VerificationResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/verify/v/{public_identifier}:
    post:
      summary: Verify product scan using public identifier
      tags:
      - Verification & Clones
      parameters:
      - name: public_identifier
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/VerifyScanRequest.yaml
            example:
              lat: 12.9716
              lon: 77.5946
              device_metadata:
                browser: string
                platform: string
      responses:
        '200':
          $ref: ./components/responses/VerificationResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/verify/register:
    post:
      summary: Register a serialized QR code and its product metadata (Producer only)
      tags:
      - Verification & Clones
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/VerifyRegisterRequest.yaml
            example:
              public_identifier: 7e3b5df9-14a8-4ce3-8991-62547bdf92e2
              gtin: 07612345678900
              serial: SN908123
              verification_url: http://localhost:8080/verify/7e3b5df9-14a8-4ce3-8991-62547bdf92e2
              qr_code_data_uri: data:image/png;base64,iVBORw0KGgoAAAANSUhEUg...
              product_metadata:
                name: Premium Farms Ltd
                manufacturer: string
                country_of_origin: string
                batch_id: string
                packaging_date: string
                expiry_date: string
                net_weight: string
                organic_certificate_number: string
                certifying_authority: string
                scan_count: string
                mint_date: string
      responses:
        '201':
          $ref: ./components/responses/VerificationRegisterResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '409':
          $ref: ./components/responses/ConflictError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/verify/revoke:
    post:
      summary: Revoke serialized codes assigned to the caller's certifier
      tags:
      - Verification & Clones
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/RevokeLotRequest.yaml
            example:
              lotId: string
              reason: string
      responses:
        '200':
          $ref: ./components/responses/RevocationResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '409':
          $ref: ./components/responses/ConflictError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/lots/{id}/revoke:
    post:
      summary: Revoke a lot assigned to the caller's certifier
      tags:
      - Verification & Clones
      security:
      - BearerAuth: []
      parameters:
      - $ref: ./components/parameters/LotId.yaml
      responses:
        '200':
          $ref: ./components/responses/RevocationResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '409':
          $ref: ./components/responses/ConflictError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/lots/{id}/assign-laboratory:
    post:
      summary: Assign an activated NABL laboratory to a certifier-controlled lot
      description: The authenticated certifier must control the lot's budget. Ownership is checked while the lot is locked; assigning the same laboratory again succeeds without changing the assignment.
      tags:
      - Verification & Clones
      security:
      - BearerAuth: []
      parameters:
      - $ref: ./components/parameters/LotId.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/AssignLaboratoryRequest.yaml
      responses:
        '200':
          $ref: ./components/responses/LaboratoryAssignmentResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/verify/unit-codes:
    get:
      summary: Get tenant-scoped operational unit codes
      tags:
      - Verification & Clones
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: ./components/responses/UnitCodeListResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/verify/lots:
    get:
      summary: Get tenant-scoped operational lots
      description: Producers and certifiers see lots derived through their owned profiles; activated NABL laboratories see only assigned lots; system-administrator access is explicit.
      tags:
      - Verification & Clones
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: ./components/responses/LotListResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/verify/lab-results:
    post:
      summary: Upload laboratory results for an assigned lot
      description: Only the activated NABL laboratory assigned to the lot may create or replace its result. The authenticated organization is persisted as the submitter; denied writes cannot change lot, code, investigation, provenance, or ledger state.
      tags:
      - Verification & Clones
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/requests/CreateLabResultRequest.yaml
            example:
              lot_id: 00000000-0000-0000-0000-000000000050
              lab_name: string
              test_type: string
              result_summary: string
              report_hash: string
              report_reference: string
      responses:
        '200':
          $ref: ./components/responses/LabResultResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/verify/investigations:
    get:
      summary: List investigations assigned through the caller's certifier
      tags:
      - Verification & Clones
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: ./components/responses/InvestigationListResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/verify/investigations/{id}:
    get:
      summary: Get a certifier-scoped investigation
      tags:
      - Verification & Clones
      security:
      - BearerAuth: []
      parameters:
      - $ref: ./components/parameters/InvestigationId.yaml
      responses:
        '200':
          $ref: ./components/responses/InvestigationResponse.yaml
        '400':
          $ref: ./components/responses/BadRequestError.yaml
        '404':
          $ref: ./components/responses/NotFoundError.yaml
        '500':
          $ref: ./components/responses/InternalServerError.yaml
        '401':
          $ref: ./components/responses/UnauthorizedError.yaml
        '403':
          $ref: ./components/responses/ForbiddenError.yaml
        '422':
          $ref: ./components/responses/ValidationErrorResponse.yaml
  /api/v1/verify/investigations/{id}/approve:
    post:
      summary: Approve product revocation for a certifier-scoped investigation
      tags:
      - Verification & Clones
      security:
      - BearerAuth: []
      parameters:
      - $ref: ./components/parameters/InvestigationId.yaml
      responses:
        '200':
