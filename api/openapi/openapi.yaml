openapi: 3.0.3
info:
  title: CapMint Core API Specifications
  version: 1.0.0
  description: Canonical REST API contracts and validation schemas for the CapMint anti-counterfeiting platform.
servers:
  - url: http://localhost:8000
    description: Local API Gateway (Docker Nginx proxy)
  - url: https://api.capmint.org/api/v1
    description: Production Gateway
paths:
  # 1. Auth Service
  /api/v1/auth/register:
    post:
      summary: Register a user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/RegisterUserRequest.yaml'
      responses:
        '201':
          $ref: './components/responses/RegisterUserResponse.yaml'

  /api/v1/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/LoginRequest.yaml'
      responses:
        '200':
          $ref: './components/responses/LoginResponse.yaml'

  /api/v1/auth/users:
    get:
      summary: Get all registered users
      tags:
        - Authentication
      responses:
        '200':
          $ref: './components/responses/UserListResponse.yaml'

  # 2. CPQ Service
  /api/v1/budgets/propose:
    post:
      summary: Propose a crop yield quota budget
      tags:
        - Quota & Budgets (CPQ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/ProposeBudgetRequest.yaml'
      responses:
        '201':
          $ref: './components/responses/BudgetResponse.yaml'

  /api/v1/budgets/approve:
    post:
      summary: Approve a proposed quota budget
      tags:
        - Quota & Budgets (CPQ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/ApproveBudgetRequest.yaml'
      responses:
        '200':
          $ref: './components/responses/BudgetApprovalResponse.yaml'

  /api/v1/budgets/drawdown:
    post:
      summary: Draw down capacity from active quota
      tags:
        - Quota & Budgets (CPQ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/BudgetDrawdownRequest.yaml'
      responses:
        '200':
          $ref: './components/responses/BudgetDrawdownResponse.yaml'

  /api/v1/budgets/{id}:
    get:
      summary: Retrieve a quota budget
      tags:
        - Quota & Budgets (CPQ)
      parameters:
        - $ref: './components/parameters/BudgetId.yaml'
      responses:
        '200':
          $ref: './components/responses/BudgetResponse.yaml'

  # 3. Mint Service
  /api/v1/qr/mint:
    post:
      summary: Mint unique QR identity codes for a lot run
      tags:
        - Serialization & Minting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/MintQRCodeRequest.yaml'
      responses:
        '201':
          $ref: './components/responses/MintQRCodeResponse.yaml'

  /api/v1/qr/lot/{id}:
    get:
      summary: Get details of a minted lot
      tags:
        - Serialization & Minting
      parameters:
        - $ref: './components/parameters/LotId.yaml'
      responses:
        '200':
          $ref: './components/responses/LotResponse.yaml'

  # 4. Resolver Service
  /01/{gtin}/21/{serial}:
    get:
      summary: Resolve canonical GS1 Digital Link redirection
      tags:
        - Resolver Redirects
      parameters:
        - $ref: './components/parameters/GTIN.yaml'
        - $ref: './components/parameters/Serial.yaml'
      responses:
        '302':
          description: Redirects to consumer provenance verification interface

  # 5. Transparency Service
  /log/append:
    post:
      summary: Append a block to the auditable transparency log
      tags:
        - Transparency Log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/AppendTransparencyLogRequest.yaml'
      responses:
        '201':
          $ref: './components/responses/TransparencyLedgerEntryResponse.yaml'

  /log/chain:
    get:
      summary: Retrieve the full transparency log chain
      tags:
        - Transparency Log
      responses:
        '200':
          $ref: './components/responses/TransparencyLedgerChainResponse.yaml'

  /log/verify:
    get:
      summary: Verify the integrity of the transparency ledger
      tags:
        - Transparency Log
      responses:
        '200':
          $ref: './components/responses/TransparencyLedgerVerificationResponse.yaml'

  # 6. Verification Service
  /api/v1/verify/{gtin}/{serial}:
    post:
      summary: Verify product authenticity & scan coordinates
      tags:
        - Verification & Clones
      parameters:
        - $ref: './components/parameters/GTIN.yaml'
        - $ref: './components/parameters/Serial.yaml'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/VerifyCodeRequest.yaml'
      responses:
        '200':
          $ref: './components/responses/VerificationResponse.yaml'

  /api/v1/revocation/lot:
    post:
      summary: Revoke an entire batch lot run (Cascades to all codes)
      tags:
        - Verification & Clones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/RevokeLotRequest.yaml'
      responses:
        '200':
          $ref: './components/responses/RevocationResponse.yaml'

  /api/v1/revocation/code:
    post:
      summary: Revoke a single unit QR serial code
      tags:
        - Verification & Clones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/RevokeQRCodeRequest.yaml'
      responses:
        '200':
          $ref: './components/responses/RevocationResponse.yaml'

  /api/v1/verify/lab-results:
    post:
      summary: Upload laboratory result reports and bind PDF hash (Certifier/Lab only)
      tags:
        - Verification & Clones
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/requests/CreateLabResultRequest.yaml'
      responses:
        '200':
          $ref: './components/responses/LabResultResponse.yaml'

  /api/v1/verify/investigations:
    get:
      summary: List all risk investigations (Certifier only)
      tags:
        - Verification & Clones
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: './components/responses/InvestigationListResponse.yaml'

  /api/v1/verify/investigations/{id}:
    get:
      summary: Get details and evidence for a specific investigation (Certifier only)
      tags:
        - Verification & Clones
      security:
        - BearerAuth: []
      parameters:
        - $ref: './components/parameters/InvestigationId.yaml'
      responses:
        '200':
          $ref: './components/responses/InvestigationResponse.yaml'

  /api/v1/verify/investigations/{id}/approve:
    post:
      summary: Approve product revocation for an investigation (Certifier only)
      tags:
        - Verification & Clones
      security:
        - BearerAuth: []
      parameters:
        - $ref: './components/parameters/InvestigationId.yaml'
      responses:
        '200':
          $ref: './components/responses/InvestigationActionResponse.yaml'

  /api/v1/verify/investigations/{id}/dismiss:
    post:
      summary: Dismiss an investigation case (Certifier only)
      tags:
        - Verification & Clones
      security:
        - BearerAuth: []
      parameters:
        - $ref: './components/parameters/InvestigationId.yaml'
      responses:
        '200':
          $ref: './components/responses/InvestigationActionResponse.yaml'

  # 7. Integration Service
  /api/v1/integrations/tracenet/certificate/{id}:
    get:
      summary: Fetch NPOP organic farmer certification status
      tags:
        - External Integrations
      parameters:
        - $ref: './components/parameters/CertificateId.yaml'
      responses:
        '200':
          $ref: './components/responses/TraceNetReferenceResponse.yaml'

  /api/v1/integrations/agristack/plot/{id}:
    get:
      summary: Fetch AgriStack verified land coordinates bounds
      tags:
        - External Integrations
      parameters:
        - $ref: './components/parameters/PlotId.yaml'
      responses:
        '200':
          $ref: './components/responses/AgriStackPlotResponse.yaml'

components:
  securitySchemes:
    BearerAuth:
      $ref: './components/security/BearerAuth.yaml'
