openapi: 3.0.3
info:
  title: CapMint Core API Specifications
  version: 1.0.0
  description: Canonical REST API contracts and validation schemas for the CapMint anti-counterfeiting platform.
servers:
  - url: 'http://localhost:8080'
    description: Dev Gateway (Local Proxy)
paths:
  /api/v1/auth/register-org:
    post:
      summary: Register an organization and its administrator
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: RegisterUserRequest
              description: Payload required to register a new organization and its initial administrator user.
              type: object
              required:
                - name
                - type
                - official_email
                - admin_username
                - admin_password
              properties:
                name:
                  type: string
                  description: Full legal name of the organization.
                  example: Premium Farms Ltd
                type:
                  type: string
                  enum:
                    - PRODUCER
                    - NABL_LABORATORY
                    - CERTIFICATION_BODY
                    - EXPORTER
                  description: Classification type of the organization.
                  example: PRODUCER
                business_reg_details:
                  type: object
                  description: Official company registration metadata details.
                  example:
                    registration_number: REG-880293
                    tax_id: GSTIN-12AAAFF001
                official_email:
                  type: string
                  format: email
                  description: Primary official contact email address.
                  example: producer@capmint.org
                contact_info:
                  type: object
                  description: Organization contact telephone or communication details.
                  example:
                    phone: +91 98765 43210
                    address: '123 Agri Lane, Bangalore, India'
                admin_username:
                  type: string
                  description: Username for the initial organization administrator account.
                  example: producer_admin
                admin_password:
                  type: string
                  format: password
                  description: Secure password for the administrator account.
                  example: password
              example:
                name: Premium Farms Ltd
                type: PRODUCER
                business_reg_details:
                  registration_number: REG-880293
                  tax_id: GSTIN-12AAAFF001
                official_email: producer@capmint.org
                contact_info:
                  phone: +91 98765 43210
                  address: '123 Agri Lane, Bangalore, India'
                admin_username: producer_admin
                admin_password: password
            example:
              username: admin
              password: password
              role: ADMIN
              associated_entity_id: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                title: RegisterUserResponse
                type: object
                required:
                  - success
                  - username
                properties:
                  success:
                    type: boolean
                    description: Request success indicator.
                    example: true
                  username:
                    type: string
                    description: Unique username identifier for the account.
                    example: admin
                description: RegisterUserResponse data schema.
                example:
                  success: true
                  username: admin
        '400':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/400'
        '404':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/404'
        '409':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/409'
        '422':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/422'
        '500':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/500'
  /api/v1/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: LoginRequest
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Unique username identifier for the account.
                  example: admin
                password:
                  type: string
                  description: Secret password for authentication.
                  example: password
                  format: password
              description: LoginRequest data schema.
              example:
                username: admin
                password: password
            example:
              username: admin
              password: password
      responses:
        '200':
          description: Login successful and JWT returned
          content:
            application/json:
              schema:
                title: LoginResponse
                type: object
                required:
                  - success
                  - token
                properties:
                  success:
                    type: boolean
                    description: Request success indicator.
                    example: true
                  token:
                    type: string
                    description: The token attribute.
                    example: string
                description: LoginResponse data schema.
                example:
                  success: true
                  token: string
        '400':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/400'
        '404':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/404'
        '422':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/422'
        '500':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/500'
  /api/v1/auth/users:
    get:
      summary: Get all registered users
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of registered users
          content:
            application/json:
              schema:
                title: UserListResponse
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      title: User
                      description: Registered user record within an organization
                      type: object
                      required:
                        - id
                        - username
                        - role
                        - associated_entity_id
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier (UUID v4).
                          example: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
                        username:
                          type: string
                          description: Unique username identifier for the account.
                          example: admin
                        role:
                          type: string
                          enum:
                            - ADMIN
                            - PRODUCER
                            - PACK_HOUSE
                            - CERTIFIER
                            - LAB
                          description: User access role within the organization.
                          example: ADMIN
                        associated_entity_id:
                          type: string
                          format: uuid
                          description: The associated_entity_id attribute.
                          example: string
                      example:
                        id: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
                        username: admin
                        role: ADMIN
                        associated_entity_id: string
                    description: The users attribute.
                    example: []
                description: UserListResponse data schema.
                example:
                  users: []
        '400':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/403'
        '404':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/404'
        '422':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/422'
        '500':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/500'
  /api/v1/auth/users/invite:
    post:
      summary: Invite a new user to the organization
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InviteUserRequest
              type: object
              required:
                - username
                - password
                - role
              properties:
                username:
                  type: string
                  description: Unique username identifier for the account.
                  example: admin
                password:
                  type: string
                  description: Secret password for authentication.
                  example: password
                  format: password
                role:
                  type: string
                  enum:
                    - ADMIN
                    - OPERATOR
                  description: User access role within the organization.
                  example: ADMIN
              description: InviteUserRequest data schema.
              example:
                username: admin
                password: password
                role: ADMIN
            example:
              username: admin
              password: password
              role: ADMIN
      responses:
        '201':
          description: User profile details returned
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v1~1auth~1register-org/post/responses/201/content/application~1json/schema'
        '400':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/403'
        '404':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/404'
        '422':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/422'
        '500':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/500'
  /api/v1/auth/organizations:
    get:
      summary: List all organizations (System Admin only)
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of registered organizations returned
          content:
            application/json:
              schema:
                title: OrganizationListResponse
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    description: Indicates request success status.
                    example: true
                  data:
                    type: object
                    required:
                      - organizations
                    properties:
                      organizations:
                        type: array
                        items:
                          title: Organization
                          description: Registered organization profile
                          type: object
                          required:
                            - id
                            - name
                            - type
                            - status
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Unique identifier (UUID v4).
                              example: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
                            name:
                              type: string
                              description: Human-readable legal name of the entity.
                              example: Premium Farms Ltd
                            type:
                              type: string
                              enum:
                                - PRODUCER
                                - NABL_LABORATORY
                                - CERTIFICATION_BODY
                                - EXPORTER
                                - SYSTEM_ADMINISTRATOR
                              description: General categorization type.
                              example: PRODUCER
                            status:
                              type: string
                              enum:
                                - PENDING_VERIFICATION
                                - ACTIVATED
                                - SUSPENDED
                              description: Current status of the entity.
                              example: ACTIVATED
                          example:
                            id: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
                            name: Premium Farms Ltd
                            type: PRODUCER
                            status: ACTIVATED
                        description: The organizations attribute.
                        example: []
                    description: The data attribute.
                    example:
                      organizations: []
                description: OrganizationListResponse data schema.
                example:
                  success: true
                  data:
                    organizations:
                      - id: 00000000-0000-0000-0000-000000000002
                        name: Premium Farms Ltd
                        type: PRODUCER
                        status: ACTIVATED
                        official_email: producer@capmint.org
                        created_at: '2026-07-17T10:00:00Z'
                        updated_at: '2026-07-17T10:05:00Z'
        '400':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/403'
        '404':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/404'
        '422':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/422'
        '500':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/500'
  '/api/v1/auth/organizations/{id}/status':
    post:
      summary: Update organization status (System Admin only)
      tags:
        - Authentication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - PENDING
                    - ACTIVATED
                    - SUSPENDED
      responses:
        '200':
          description: Organization profile details returned
          content:
            application/json:
              schema:
                title: OrganizationResponse
                type: object
                required:
                  - organization
                properties:
                  organization:
                    $ref: '#/paths/~1api~1v1~1auth~1organizations/get/responses/200/content/application~1json/schema/properties/data/properties/organizations/items'
                    description: The organization attribute.
                    example: null
                description: OrganizationResponse data schema.
                example:
                  organization: null
        '400':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/403'
        '404':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/404'
        '422':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/422'
        '500':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/500'
  /api/v1/budgets:
    post:
      summary: Propose a crop yield quota budget
      description: The authenticated producer organization is authoritative. The backend resolves its single producer profile when producer_id is omitted; a legacy producer_id is accepted only when it names a caller-owned profile, and ambiguous ownership fails closed.
      tags:
        - Quota & Budgets (CPQ)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ProposeBudgetRequest
              type: object
              required:
                - certifier_id
                - source_unit_type
                - approved_quantity
                - yield_assumptions
                - signature_bundle
                - effective_start_date
                - effective_end_date
              properties:
                producer_id:
                  type: string
                  format: uuid
                  description: Legacy producer profile identifier. When omitted, the backend resolves the caller's single owned producer profile; when supplied, it must resolve to that caller.
                  example: 00000000-0000-0000-0000-000000000002
                certifier_id:
                  type: string
                  format: uuid
                  description: Unique identifier referencing the certifier body.
                  example: 00000000-0000-0000-0000-000000000001
                source_unit_type:
                  type: string
                  enum:
                    - UNIT_COUNT
                    - WEIGHT_KG
                  description: 'Measurement unit standard (e.g. weight, count).'
                  example: WEIGHT_KG
                approved_quantity:
                  type: number
                  description: Total certified crop volume allocated.
                  example: 5000
                yield_assumptions:
                  type: object
                  required:
                    - crop
                  properties:
                    crop:
                      type: string
                      description: Crop name.
                      example: Organic White Honey
                    land_area_hectares:
                      type: number
                      description: Land area in hectares.
                      example: 5
                  description: Agricultural yield parameters.
                  example:
                    crop: Organic White Honey
                    land_area_hectares: 5
                signature_bundle:
                  type: string
                  description: Ed25519 cryptographic signatures payload.
                  example: sig_bundle_xyz123
                effective_start_date:
                  type: string
                  format: date-time
                  description: ISO-8601 validity start timestamp.
                  example: '2026-07-17T00:00:00Z'
                effective_end_date:
                  type: string
                  format: date-time
                  description: ISO-8601 validity expiration timestamp.
                  example: '2027-07-17T00:00:00Z'
              description: ProposeBudgetRequest data schema.
              example:
                producer_id: 00000000-0000-0000-0000-000000000002
                certifier_id: 00000000-0000-0000-0000-000000000001
                source_unit_type: WEIGHT_KG
                approved_quantity: 5000
                yield_assumptions:
                  crop: Organic White Honey
                  land_area_hectares: 5
                signature_bundle: sig_bundle_xyz123
                effective_start_date: '2026-07-17T00:00:00Z'
                effective_end_date: '2027-07-17T00:00:00Z'
            example:
              certifier_id: 00000000-0000-0000-0000-000000000001
              source_unit_type: WEIGHT_KG
              approved_quantity: 5000
              yield_assumptions:
                crop: Organic White Honey
                land_area_hectares: 5
              signature_bundle: sig_bundle_xyz123
              effective_start_date: '2026-07-17T00:00:00Z'
              effective_end_date: '2027-07-17T00:00:00Z'
      responses:
        '201':
          description: Quota budget details returned
          content:
            application/json:
              schema:
                title: BudgetResponse
                type: object
                required:
                  - budget
                properties:
                  budget:
                    description: The budget attribute.
                    example: null
                    title: Budget
                    type: object
                    required:
                      - id
                      - producerId
                      - cropType
                      - limitKg
                      - remainingKg
                      - status
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier (UUID v4).
                        example: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
                      producerId:
                        type: string
                        format: uuid
                        description: The producerId attribute.
                        example: string
                      cropType:
                        type: string
                        description: The cropType attribute.
                        example: string
                      limitKg:
                        type: number
                        description: The limitKg attribute.
                        example: 1
                      remainingKg:
                        type: number
                        description: The remainingKg attribute.
                        example: 1
                      status:
                        type: string
                        enum:
                          - PROPOSED
                          - ACTIVE
                          - EXHAUSTED
                          - REVOKED
                        description: Current status of the entity.
                        example: ACTIVATED
                description: BudgetResponse data schema.
                example:
                  budget: null
        '400':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/403'
        '404':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/404'
        '422':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/422'
        '500':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/500'
    get:
      summary: Retrieve tenant-scoped quota budgets
      description: Producers see their budgets, certifiers see budgets assigned to them, and system-administrator admins may see all budgets.
      tags:
        - Quota & Budgets (CPQ)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of quota budgets returned
          content:
            application/json:
              schema:
                title: BudgetListResponse
                type: object
                required:
                  - budgets
                properties:
                  budgets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier (UUID v4).
                          example: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
                          format: uuid
                        producer:
                          type: string
                          description: The producer attribute.
                          example: string
                        allocated:
                          type: number
                          description: The allocated attribute.
                          example: 1
                        consumed:
                          type: number
                          description: The consumed attribute.
                          example: 1
                        status:
                          type: string
                          description: Current status of the entity.
                          example: ACTIVATED
                        crop:
                          type: string
                          description: Crop name.
                          example: Organic White Honey
                        start:
                          type: string
                          format: date-time
                          description: The start attribute.
                          example: string
                        end:
                          type: string
                          format: date-time
                          description: The end attribute.
                          example: string
                    description: The budgets attribute.
                    example:
                      - id: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
                        producer: string
                        allocated: 1
                        consumed: 1
                        status: ACTIVATED
                        crop: Organic White Honey
                        start: string
                        end: string
                description: BudgetListResponse data schema.
                example:
                  budgets:
                    - id: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
                      producer: string
                      allocated: 1
                      consumed: 1
                      status: ACTIVATED
                      crop: Organic White Honey
                      start: string
                      end: string
        '400':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/403'
        '404':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/404'
        '422':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/422'
        '500':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/500'
  '/api/v1/budgets/{id}/activate':
    post:
      summary: Approve/Activate a budget assigned to the caller's certifier
      tags:
        - Quota & Budgets (CPQ)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the quota budget
          schema:
            type: string
          example: 19b0b138-f4cb-4e03-9ce0-06c4cbcdf92e
      responses:
        '200':
          description: Quota approved and activated
          content:
            application/json:
              schema:
                title: BudgetApprovalResponse
                type: object
                required:
                  - success
                  - budgetId
                properties:
                  success:
                    type: boolean
                    description: Request success indicator.
                    example: true
                  budgetId:
                    type: string
                    description: Unique identifier of the associated budget.
                    example: 00000000-0000-0000-0000-000000000010
                    format: uuid
                description: BudgetApprovalResponse data schema.
                example:
                  success: true
                  budgetId: 00000000-0000-0000-0000-000000000010
        '400':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/403'
        '404':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/404'
        '409':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/409'
        '422':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/422'
        '500':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/500'
  '/api/v1/budgets/{id}/drawdown':
    post:
      summary: Draw down capacity from the owning producer's active quota
      tags:
        - Quota & Budgets (CPQ)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/paths/~1api~1v1~1budgets~1%7Bid%7D~1activate/post/parameters/0'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: BudgetDrawdownRequest
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  description: The quantity to draw down from the budget capacity.
                  example: 1
              description: BudgetDrawdownRequest data schema.
              example:
                amount: 1
            example:
              amount: 1
      responses:
        '200':
          description: Capacity locked and drawn down
          content:
            application/json:
              schema:
                title: BudgetDrawdownResponse
                type: object
                required:
                  - success
                  - budgetId
                  - remainingKg
                properties:
                  success:
                    type: boolean
                    description: Request success indicator.
                    example: true
                  budgetId:
                    type: string
                    description: Unique identifier of the associated budget.
                    example: 00000000-0000-0000-0000-000000000010
                    format: uuid
                  remainingKg:
                    type: number
                    description: The remainingKg attribute.
                    example: 1
                description: BudgetDrawdownResponse data schema.
                example:
                  success: true
                  budgetId: 00000000-0000-0000-0000-000000000010
                  remainingKg: 1
        '400':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/403'
        '404':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/404'
        '422':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/422'
        '500':
          $ref: '#/paths/~1api~1v1~1mint/post/responses/500'
  /api/v1/mint:
    post:
      summary: Mint serialized numbers for a lot owned by the caller's producer
      tags:
        - Serialization & Minting
